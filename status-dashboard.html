<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NebulaBox Project Status Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header .subtitle {
            color: #666;
            font-size: 1.1em;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .stat-card h3 {
            color: #333;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }
        
        .section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .section h2 {
            color: #667eea;
            font-size: 1.8em;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .todo-item {
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            background: #f8f9fa;
            transition: all 0.3s ease;
        }
        
        .todo-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }
        
        .todo-status {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 15px;
            flex-shrink: 0;
        }
        
        .status-completed {
            background: #28a745;
        }
        
        .status-in-progress {
            background: #ffc107;
            animation: pulse 2s infinite;
        }
        
        .status-pending {
            background: #dc3545;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .todo-content {
            flex: 1;
        }
        
        .todo-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        
        .todo-description {
            color: #666;
            font-size: 0.9em;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }
        
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .feature-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            border-left: 4px solid #667eea;
        }
        
        .feature-card h3 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .feature-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 600;
            margin-top: 10px;
        }
        
        .status-ready { background: #d4edda; color: #155724; }
        .status-dev { background: #fff3cd; color: #856404; }
        .status-testing { background: #cce5ff; color: #004085; }
        .status-pending { background: #f8d7da; color: #721c24; }
        
        .last-updated {
            text-align: center;
            color: #666;
            font-size: 0.9em;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e9ecef;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 NebulaBox Project Status</h1>
            <p class="subtitle">Real-time development and testing progress dashboard</p>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Overall Progress</h3>
                <div class="stat-value" id="overall-progress">16%</div>
                <div class="stat-label">of H1 Foundation Phase</div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 16%"></div>
                </div>
            </div>
            
            <div class="stat-card">
                <h3>Completed Tasks</h3>
                <div class="stat-value" id="completed-tasks">7</div>
                <div class="stat-label">of 40+ planned tasks</div>
            </div>
            
            <div class="stat-card">
                <h3>In Progress</h3>
                <div class="stat-value" id="in-progress">2</div>
                <div class="stat-label">active tasks</div>
            </div>
            
            <div class="stat-card">
                <h3>Schema-First</h3>
                <div class="stat-value" id="schema-status">✅</div>
                <div class="stat-label">Foundation complete</div>
            </div>
        </div>
        
        <div class="section">
            <h2>📋 Task Checklist</h2>
            <div id="todo-list">
                <!-- Todo items will be inserted here -->
            </div>
        </div>
        
        <div class="section">
            <h2>🎯 Features & Status</h2>
            <div class="feature-grid" id="features-grid">
                <!-- Feature cards will be inserted here -->
            </div>
        </div>
        
        <div class="last-updated">
            Last updated: <span id="last-updated-time"></span>
        </div>
    </div>
    
    <script>
        // Task data
        const tasks = [
            {
                id: 'db-1',
                title: 'Set up PostgreSQL database',
                status: 'completed',
                description: 'PostgreSQL connection, schema, and migrations'
            },
            {
                id: 'db-2',
                title: 'Set up MongoDB database',
                status: 'completed',
                description: 'MongoDB connection with TTL indexes for logs'
            },
            {
                id: 'db-3',
                title: 'Implement repository pattern',
                status: 'completed',
                description: 'Container, Image, and Workspace repositories'
            },
            {
                id: 'db-4',
                title: 'Migrate core data to PostgreSQL',
                status: 'completed',
                description: 'Repositories integrated into API server'
            },
            {
                id: 'db-5',
                title: 'Migrate logs to MongoDB',
                status: 'pending',
                description: 'Container logs, API metrics, audit logs'
            },
            {
                id: 'schema-1',
                title: 'Schema-first architecture foundation',
                status: 'completed',
                description: 'Central schema definition with code generation'
            },
            {
                id: 'schema-2',
                title: 'Code generation infrastructure',
                status: 'completed',
                description: 'Auto-generate TypeScript, Go, API client from schema'
            },
            {
                id: 'schema-3',
                title: 'Live testing hooks',
                status: 'completed',
                description: 'Auto-testing on file save (Cursor-like)'
            },
            {
                id: 'schema-4',
                title: 'Collaboration sync layer',
                status: 'completed',
                description: 'Real-time file sync (Replit-like)'
            },
            {
                id: 'test-aware-1',
                title: 'Add data-test-id attributes',
                status: 'completed',
                description: 'Test IDs added to interactive UI elements'
            },
            {
                id: 'test-aware-5',
                title: 'Complete test IDs for all pages',
                status: 'in_progress',
                description: '20% complete - 5/25 pages done'
            },
            {
                id: 'api-test-1',
                title: 'Expand API unit tests',
                status: 'pending',
                description: 'Target: 85%+ coverage for all endpoints'
            }
        ];
        
        // Feature data
        const features = [
            {
                name: 'Container Runtime',
                status: 'ready',
                description: 'Core container operations with containerd integration'
            },
            {
                name: 'Image Management',
                status: 'ready',
                description: 'Pull, push, build, and scan container images'
            },
            {
                name: 'Database Layer',
                status: 'ready',
                description: 'PostgreSQL + MongoDB with repository pattern ✅'
            },
            {
                name: 'Schema-First Architecture',
                status: 'dev',
                description: 'Central schema with auto-generated code 🚀'
            },
            {
                name: 'Live Testing Hooks',
                status: 'ready',
                description: 'Auto-testing on file save (Cursor-like) ✅'
            },
            {
                name: 'Collaboration Sync',
                status: 'ready',
                description: 'Real-time file synchronization (Replit-like) ✅'
            },
            {
                name: 'Shared Runtime',
                status: 'dev',
                description: 'Multi-user workspace collaboration'
            },
            {
                name: 'Orchestrator',
                status: 'dev',
                description: 'Multi-node cluster management'
            },
            {
                name: 'Test-Aware System',
                status: 'testing',
                description: 'E2E test infrastructure with Playwright'
            }
        ];
        
        // Render todos
        function renderTodos() {
            const todoList = document.getElementById('todo-list');
            todoList.innerHTML = '';
            
            tasks.forEach(task => {
                const todoItem = document.createElement('div');
                todoItem.className = 'todo-item';
                
                const statusClass = `status-${task.status.replace('_', '-')}`;
                todoItem.innerHTML = `
                    <div class="todo-status ${statusClass}"></div>
                    <div class="todo-content">
                        <div class="todo-title">${task.title}</div>
                        <div class="todo-description">${task.description}</div>
                    </div>
                `;
                
                todoList.appendChild(todoItem);
            });
        }
        
        // Render features
        function renderFeatures() {
            const featuresGrid = document.getElementById('features-grid');
            featuresGrid.innerHTML = '';
            
            features.forEach(feature => {
                const featureCard = document.createElement('div');
                featureCard.className = 'feature-card';
                featureCard.innerHTML = `
                    <h3>${feature.name}</h3>
                    <p>${feature.description}</p>
                    <span class="feature-status status-${feature.status}">${feature.status.toUpperCase()}</span>
                `;
                featuresGrid.appendChild(featureCard);
            });
        }
        
        // Update stats
        function updateStats() {
            const completed = tasks.filter(t => t.status === 'completed').length;
            const inProgress = tasks.filter(t => t.status === 'in_progress').length;
            const total = tasks.length;
            const progress = Math.round((completed / total) * 100);
            
            document.getElementById('completed-tasks').textContent = completed;
            document.getElementById('in-progress').textContent = inProgress;
            document.getElementById('overall-progress').textContent = progress + '%';
            document.querySelector('.progress-fill').style.width = progress + '%';
            
            const now = new Date();
            document.getElementById('last-updated-time').textContent = now.toLocaleString();
        }
        
        // Initialize
        renderTodos();
        renderFeatures();
        updateStats();
        
        // Auto-refresh every 30 seconds (optional)
        // setInterval(updateStats, 30000);
    </script>
</body>
</html>
