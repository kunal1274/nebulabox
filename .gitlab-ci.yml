image: golang:1.21

stages:
  - test
  - build
  - lint
  - frontend
  - deploy

variables:
  GO_VERSION: "1.21"
  NODE_VERSION: "20"

cache:
  paths:
    - .go/pkg/mod
    - web/dashboard/node_modules

before_script:
  - go version
  - go env

unit_tests:
  stage: test
  script:
    - make test-unit
  coverage: '/coverage: \d+\.\d+% of statements/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.html
    expire_in: 1 week

integration_tests:
  stage: test
  script:
    - make test-integration
  allow_failure: true

benchmarks:
  stage: test
  script:
    - make benchmark-api || true
  allow_failure: true
  artifacts:
    paths:
      - benchmark-results.txt
    expire_in: 1 week

build_api:
  stage: build
  script:
    - make build-api
    - ls -lh nebulabox-api
  artifacts:
    paths:
      - nebulabox-api
    expire_in: 1 week

build_test:
  stage: build
  script:
    - make build-test
    - ls -lh nebulabox-test
  artifacts:
    paths:
      - nebulabox-test
    expire_in: 1 week

lint:
  stage: lint
  image: golangci/golangci-lint:latest
  script:
    - golangci-lint run --timeout=5m
  allow_failure: true

frontend_build:
  stage: frontend
  image: node:${NODE_VERSION}
  script:
    - cd web/dashboard
    - npm ci
    - npm run build
  artifacts:
    paths:
      - web/dashboard/dist
    expire_in: 1 week

deploy_staging:
  stage: deploy
  script:
    - echo "Deploying to staging environment..."
    - echo "Add your deployment commands here"
  environment:
    name: staging
    url: https://staging.nebulabox.example.com
  only:
    - develop
  when: manual

deploy_production:
  stage: deploy
  script:
    - echo "Deploying to production environment..."
    - echo "Add your deployment commands here"
  environment:
    name: production
    url: https://nebulabox.example.com
  only:
    - main
    - master
  when: manual

